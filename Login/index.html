<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEXUS — Sign In</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- Cinematic canvas background -->
  <canvas id="cosmos"></canvas>

  <!-- Aurora glow orbs -->
  <div class="aurora">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" stroke="#4361EE" stroke-width="1.5" fill="none"/>
        <polygon points="18,8 28,13 28,23 18,28 8,23 8,13" stroke="#4361EE" stroke-width="1" fill="rgba(67,97,238,0.08)"/>
        <circle cx="18" cy="18" r="3" fill="#4361EE"/>
      </svg>
      <span>NEXUS</span>
    </div>

    <ul class="nav-links" id="navLinks">
      <li><a href="#" class="nav-link active">Home</a></li>
      <li><a href="#" class="nav-link">Features</a></li>
      <li><a href="#" class="nav-link">Pricing</a></li>
      <li><a href="#" class="nav-link">About</a></li>
    </ul>

    <div class="nav-actions">
      <a href="#" class="nav-btn-ghost">Log in</a>
      <a href="#" class="nav-btn-solid">Get Started</a>
    </div>

    <!-- Hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Login card -->
  <main class="stage">
    <div class="card" id="loginCard">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" stroke="#4361EE" stroke-width="1.5" fill="none"/>
            <polygon points="18,8 28,13 28,23 18,28 8,23 8,13" stroke="#4361EE" stroke-width="1" fill="rgba(67,97,238,0.08)"/>
            <circle cx="18" cy="18" r="3" fill="#4361EE"/>
          </svg>
        </div>
        <span class="brand-name">NEXUS</span>
      </div>

      <h1 class="headline">Welcome back</h1>
      <p class="sub">Sign in to continue your journey</p>

      <form class="form" id="loginForm" novalidate>

        <div class="field" id="fieldEmail">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
            <svg class="field-icon" viewBox="0 0 20 20" fill="none">
              <path d="M2 5l8 5 8-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
          <span class="error-msg" id="emailErr"></span>
        </div>

        <div class="field" id="fieldPwd">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Show password">
              <svg class="eye-icon" id="eyeIcon" viewBox="0 0 20 20" fill="none">
                <path d="M1 10s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </div>
          <span class="error-msg" id="pwdErr"></span>
        </div>

        <div class="row-meta">
          <label class="remember">
            <input type="checkbox" id="remember"/>
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-label">Sign In</span>
          <span class="btn-loader" id="btnLoader"></span>
        </button>

      </form>

      <p class="signup-cta">Don't have an account? <a href="#">Create one</a></p>

      <!-- Divider -->
      <div class="divider"><span>or continue with</span></div>

      <div class="social-row">
        <button class="social-btn" aria-label="Google">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.17 10.2c0-.63-.06-1.25-.17-1.84H10v3.48h4.58a3.9 3.9 0 01-1.7 2.57v2.13h2.75c1.61-1.48 2.54-3.67 2.54-6.34z" fill="#4285F4"/>
            <path d="M10 18.5c2.3 0 4.23-.76 5.64-2.06l-2.75-2.13c-.76.51-1.73.81-2.89.81-2.22 0-4.1-1.5-4.77-3.51H2.38v2.2A8.5 8.5 0 0010 18.5z" fill="#34A853"/>
            <path d="M5.23 11.61A5.08 5.08 0 015 10c0-.56.1-1.1.23-1.61V6.19H2.38A8.5 8.5 0 001.5 10c0 1.37.33 2.67.88 3.81l2.85-2.2z" fill="#FBBC05"/>
            <path d="M10 4.88c1.25 0 2.37.43 3.25 1.27l2.44-2.44C14.22 2.35 12.3 1.5 10 1.5A8.5 8.5 0 002.38 6.19l2.85 2.2C5.9 6.38 7.78 4.88 10 4.88z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn" aria-label="GitHub">
          <svg viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M10 1.5a8.5 8.5 0 00-2.69 16.57c.43.08.59-.18.59-.41v-1.44c-2.37.51-2.87-1.14-2.87-1.14-.39-1-.95-1.26-.95-1.26-.78-.53.06-.52.06-.52.86.06 1.31.88 1.31.88.76 1.3 2 .93 2.49.71.08-.55.3-.93.54-1.14-1.9-.22-3.9-.95-3.9-4.22 0-.93.33-1.7.88-2.3-.09-.21-.38-1.08.08-2.26 0 0 .72-.23 2.35.88A8.17 8.17 0 0110 6.87c.73 0 1.46.1 2.14.29 1.63-1.11 2.35-.88 2.35-.88.46 1.18.17 2.05.08 2.26.55.6.88 1.37.88 2.3 0 3.28-2 4-3.91 4.21.31.27.58.79.58 1.6v2.37c0 .23.15.5.59.41A8.5 8.5 0 0010 1.5z" clip-rule="evenodd"/>
          </svg>
          GitHub
        </button>
      </div>

    </div>
  </main>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">
      <svg viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="25" stroke="#4361EE" stroke-width="2"/>
        <path d="M14 26l9 9 15-17" stroke="#4361EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="check-path"/>
      </svg>
    </div>
    <p>Signed in successfully</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
